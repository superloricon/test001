name: Daily 写作提醒

on:
  schedule:
    # 周一至周五 14:25（Asia/Shanghai，UTC+8）= 06:25 UTC
    - cron: "25 6 * * 1-5"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 创建或评论 Daily 提醒 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = "daily-reminder";
            const timeZone = "Asia/Shanghai";
            const now = new Date();
            const today = new Intl.DateTimeFormat("zh-CN", {
              timeZone,
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              weekday: "long",
            }).format(now);

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LABEL,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LABEL,
                color: "FBCA04",
                description: "工作日 Daily 写作提醒",
              });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: LABEL,
              state: "open",
              per_page: 10,
            });

            const title = "📝 工作日 Daily 提醒";
            const body = [
              "## 写 Daily",
              "",
              `今天是 **${today}**，现在是工作日 14:25（Asia/Shanghai）。`,
              "",
              "请填写今日 daily：",
              "- 今天完成了什么",
              "- 遇到什么阻塞",
              "- 明天计划做什么",
              "",
              "---",
              "_由 GitHub Actions 在每个工作日 14:25 自动提醒。合并本工作流到默认分支后才会按点触发。_",
            ].join("\n");

            const issue = issues.find((item) => !item.pull_request);

            if (!issue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [LABEL],
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });
